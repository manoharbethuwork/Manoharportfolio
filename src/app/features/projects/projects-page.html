<section class="projects_page">
  <div class="container">
    <a appSectionLink="projects" class="projects_page_back">
      <i class="ri-arrow-left-line" aria-hidden="true"></i>
      Back
    </a>

    <h1 class="visually-hidden">Projects</h1>

    @if (independent.length > 0) {
    <h2 class="group_title">Independent Builds</h2>

    <ul class="projects_grid">
      @for (project of independent; track project.title) {
      <li>
        <app-project-card [project]="project" />
      </li>
      }
    </ul>

    <hr class="group_divider" />
    }

    <h2 class="group_title">Foundational Work</h2>

    <ul class="projects_grid">
      @for (project of foundational; track project.title) {
      <li>
        <app-project-card [project]="project" />
      </li>
      }
    </ul>
  </div>
</section>
