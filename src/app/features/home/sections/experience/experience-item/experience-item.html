<span class="item_marker" aria-hidden="true">
  <i class="ri-briefcase-line"></i>
</span>

<article class="item_card">
  <header class="item_header">
    <div>
      <h3 class="item_role">{{ job().role }}</h3>
      @if (job().companyUrl) {
      <a class="item_company item_company--link" [href]="job().companyUrl" target="_blank" rel="noopener noreferrer">
        {{ job().company }}
      </a>
      } @else {
      <p class="item_company">{{ job().company }}</p>
      }
    </div>
    <span class="item_period">
      <i class="ri-calendar-line" aria-hidden="true"></i>
      {{ job().period }}
    </span>
  </header>

  <ul class="item_points">
    @for (point of job().points; track point) {
    <li>{{ point }}</li>
    }
  </ul>

  <ul class="item_tags">
    @for (tech of job().technologies; track tech) {
    <li><app-tech-tag [label]="tech" /></li>
    }
  </ul>
</article>
