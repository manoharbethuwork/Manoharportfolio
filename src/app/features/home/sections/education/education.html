<section id="education" class="education">
  <div class="container">
    <app-section-heading label="Education" />

    <div class="education_layout">
      <div class="education_visual" aria-hidden="true">
        <span class="education_icon">
          <i class="ri-graduation-cap-line"></i>
        </span>
      </div>

      <ul class="education_list">
        @for (record of records; track record.institution) {
        <li>
          <app-education-card [record]="record" />
        </li>
        }
      </ul>
    </div>
  </div>
</section>
